name: Prepare release

on:
  workflow_dispatch:

env:
  CONVCO_VERSION: v0.4.2
  CONVCO_SHA256: b83ca3aff647ac3cd17c1b68f15005244a7f9022f4fadbcf76bc9e3461905a11

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Open release pull request
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install convco
        run: |
          archive="$RUNNER_TEMP/convco.zip"
          curl -sSfL \
            "https://github.com/convco/convco/releases/download/${CONVCO_VERSION}/convco-ubuntu.zip" \
            --output "$archive"
          printf '%s  %s\n' "$CONVCO_SHA256" "$archive" | sha256sum --check
          zcat "$archive" > /usr/local/bin/convco
          chmod +x /usr/local/bin/convco

      - name: Prepare release files
        id: prepare
        run: |
          set -euo pipefail
          scripts/prepare-release.sh
          if git diff --quiet HEAD --; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable conventional commits." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select release identity
        id: release
        if: steps.prepare.outputs.release == 'true'
        run: |
          set -euo pipefail
          version="$(jq -er '.version | select(type == "string")' .claude-plugin/plugin.json)"
          tag="$version"
          branch="release/$tag"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "release tag already exists: $tag" >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "release branch already exists: $branch" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Commit release preparation
        if: steps.prepare.outputs.release == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git switch -c "$RELEASE_BRANCH"
          git add \
            .claude-plugin/plugin.json \
            template/.second-brain \
            vault-tooling/pyproject.toml \
            vault-tooling/uv.lock
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "release preparation produced no changes" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): prepare $RELEASE_TAG"

          if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "release commit left uncommitted files" >&2
            git status --short >&2
            exit 1
          fi

      - name: Verify release archive
        if: steps.prepare.outputs.release == 'true'
        run: |
          set -euo pipefail
          scripts/build-release.sh dist/second-brain.zip
          unzip -tq dist/second-brain.zip

      - name: Push branch and open pull request
        if: steps.prepare.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --set-upstream origin "$RELEASE_BRANCH"
          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$GITHUB_DEFAULT_BRANCH" \
            --head "$RELEASE_BRANCH" \
            --title "chore(release): prepare $RELEASE_TAG" \
            --body "Generated by the Prepare release workflow. Review the version, approve the workflows, then squash merge it.")"
          printf 'Release pull request: %s\n' "$pr_url" | tee -a "$GITHUB_STEP_SUMMARY"
