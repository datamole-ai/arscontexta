name: Publish release archive

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Run repository tests
        run: uv run --python 3.12 python -m unittest discover -s tests -p "test_*.py"

      - name: Build and verify archive
        run: |
          set -euo pipefail
          scripts/build-release.sh dist/second-brain.zip

      - name: Check reproducible output
        run: |
          set -euo pipefail
          scripts/build-release.sh dist/rebuilt.zip
          cmp dist/second-brain.zip dist/rebuilt.zip

      - name: Write SHA-256 checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum second-brain.zip > second-brain.zip.sha256
          sha256sum --check second-brain.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="v$(uv run --python 3.12 python -c \
            'import json, pathlib; print(json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text())["version"])')"
          gh release create "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "Second Brain $release_tag" \
            dist/second-brain.zip \
            dist/second-brain.zip.sha256
