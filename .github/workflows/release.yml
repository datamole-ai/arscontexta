name: Publish release archive

on:
  workflow_dispatch:
    inputs:
      release_pr:
        description: Merged release preparation pull request number
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release commit
        id: release_pr
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release_pr }}
        run: |
          set -euo pipefail
          case "$RELEASE_PR" in
            ''|*[!0-9]*)
              echo "release_pr must be a pull request number" >&2
              exit 1
              ;;
          esac

          pr="$(gh pr view "$RELEASE_PR" \
            --repo "$GITHUB_REPOSITORY" \
            --json state,mergeCommit,baseRefName,headRefName,url)"
          state="$(jq -r .state <<< "$pr")"
          base="$(jq -r .baseRefName <<< "$pr")"
          head="$(jq -r .headRefName <<< "$pr")"
          sha="$(jq -r '.mergeCommit.oid // empty' <<< "$pr")"
          url="$(jq -r .url <<< "$pr")"

          if [ "$state" != "MERGED" ] || [ -z "$sha" ]; then
            echo "release pull request must be merged: $url" >&2
            exit 1
          fi
          if [ "$base" != "$DEFAULT_BRANCH" ]; then
            echo "release pull request targets $base, expected $DEFAULT_BRANCH" >&2
            exit 1
          fi
          case "$head" in
            release/[0-9]*) ;;
            *)
              echo "release pull request has unexpected branch: $head" >&2
              exit 1
              ;;
          esac

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.release_pr.outputs.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Verify release identity
        id: release
        env:
          RELEASE_HEAD: ${{ steps.release_pr.outputs.head }}
          RELEASE_SHA: ${{ steps.release_pr.outputs.sha }}
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          tag="$version"

          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "checked-out commit does not match the release pull request" >&2
            exit 1
          fi
          if [ "$RELEASE_HEAD" != "release/$tag" ]; then
            echo "release branch $RELEASE_HEAD does not match version $version" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "release tag already exists: $tag" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run repository tests
        run: uv run --python 3.12 python -m unittest discover -s tests -p "test_*.py"

      - name: Build and verify archive
        run: |
          set -euo pipefail
          scripts/build-release.sh dist/second-brain.zip

      - name: Check reproducible output
        run: |
          set -euo pipefail
          scripts/build-release.sh dist/rebuilt.zip
          cmp dist/second-brain.zip dist/rebuilt.zip

      - name: Write SHA-256 checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum second-brain.zip > second-brain.zip.sha256
          sha256sum --check second-brain.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release_pr.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --generate-notes \
            --title "Second Brain $RELEASE_TAG" \
            dist/second-brain.zip \
            dist/second-brain.zip.sha256
