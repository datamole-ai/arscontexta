[project]
name = "second-brain-release-tools"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
release = [
  "rooster==0.1.1",
]

[tool.uv]
package = false

[tool.rooster]
changelog-contributors = false
major-labels = ["breaking"]
minor-labels = ["enhancement"]
patch-labels = ["bug"]
ignore-labels = ["internal", "ci", "testing", "automations"]
version-files = ["pyproject.toml"]

[tool.rooster.section-labels]
"Breaking changes" = ["breaking"]
Enhancements = ["enhancement"]
"Bug fixes" = ["bug"]
Documentation = ["documentation"]
