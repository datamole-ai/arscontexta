[project]
name = "dtml-second-brain"
version = "0.1.0"
description = "Vault-local deterministic tooling for Second Brain generated knowledge systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
vault = "vault.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vault"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "F",      # Pyflakes correctness checks
  "I",      # import sorting
  "UP",     # pyupgrade modernization
  "B",      # flake8-bugbear bug patterns
  "TID252", # ban relative imports
]
