[project]
name = "dtml-second-brain"
version = "0.0.0" # Packaging placeholder; not used at runtime.
description = "Vault-local deterministic tooling for Second Brain generated knowledge systems"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.13.4,<3",
  "pyyaml>=6.0.3",
  "typer>=0.27.1",
]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project.scripts]
vault = "vault.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vault"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.1",
  "ty>=0.0.65",
]

[tool.ty.src]
include = ["src"]
exclude = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "F",      # Pyflakes correctness checks
  "I",      # import sorting
  "UP",     # pyupgrade modernization
  "B",      # flake8-bugbear bug patterns
  "TID252", # ban relative imports
]
