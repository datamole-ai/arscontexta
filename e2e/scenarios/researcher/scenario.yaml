name: researcher
setup:
  opening: >
    I'm a machine learning researcher. I read papers and pull out individual
    claims with the evidence behind them, and I connect claims into arguments.
    Call the notes folder "claims", the inbox "reading-pile", and the archive
    "processed". The note types I care about are claim, method, and
    open-question. Make your best calls on everything else - no follow-up
    questions needed, just set it up.
  continuation: "Whatever you think is best - yes, create it exactly as proposed, no adjustments."
  max_turns: 6
expect:
  vocabulary:
    note_collection: claims
    inbox: reading-pile
    archive: processed
  content_type_includes: [moc, claim]
process_runs:
  - fixture: inbox/paper-attention.md
    mode: structure
    expect:
      batch: paper-attention
      min_new_notes: 1
